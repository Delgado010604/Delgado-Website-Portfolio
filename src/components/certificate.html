<article class="certificate" data-category="$category">
  <span class="cert-number">$number</span>
  <div>
    <p class="cert-issuer">$issuer</p>
    <h2>$title</h2>
    $credential
  </div>
  <div class="cert-end">
    <span>$date</span>
    <a href="$href" target="_blank" rel="noopener noreferrer" aria-label="View $title certificate from $issuer (opens in new tab)">View certificate <span aria-hidden="true">↗</span></a>
  </div>
</article>
